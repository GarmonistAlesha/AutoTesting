plugins {
  id 'java'
  id 'io.qameta.allure' version '2.9.3'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
  mavenCentral()
}

ext {
  allureVersion = '2.29.0'
  junitVersion = '5.11.3'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

dependencies {
  testImplementation('com.codeborne:selenide:7.6.0')
  testImplementation("io.qameta.allure:allure-selenide:${allureVersion}")
  testImplementation('org.slf4j:slf4j-simple:2.0.16')
  testImplementation('com.github.javafaker:javafaker:1.0.2')
  testImplementation("com.codeborne:pdf-test:1.5.0")
  testImplementation("com.codeborne:xls-test:1.4.3")
  testImplementation("com.opencsv:opencsv:5.11")
  testImplementation("com.google.code.gson:gson:2.13.1")



  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testImplementation("org.junit.jupiter:junit-jupiter-params:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")


}

test {
useJUnitPlatform()}
allure {
  autoconfigure = true
  version = "${allureVersion}"

useJUnit5 {
    version = "${allureVersion}"
  }}